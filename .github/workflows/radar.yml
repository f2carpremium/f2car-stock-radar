name: F2CAR Stock Radar

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "base or check"
        required: true
        default: "check"
  schedule:
    # GitHub Actions uses UTC. These correspond to 04:00 and 10:00 in Portugal
    # during the current WEST period. The job remains daily across DST changes.
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect scheduled mode
        id: mode
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "mode=base" >> "$GITHUB_OUTPUT"
          else
            echo "mode=check" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run radar
        run: python radar.py "${{ steps.mode.outputs.mode }}"

      - name: Save radar data
        run: |
          git config user.name "F2CAR Stock Radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update radar stock"
          git push
