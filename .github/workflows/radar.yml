name: F2CAR Stock Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run radar
        run: python radar.py
      - name: Save state
        run: |
          git config user.name "F2CAR Stock Radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/last_alerts.json
          git diff --cached --quiet || git commit -m "Update radar state"
          git push
